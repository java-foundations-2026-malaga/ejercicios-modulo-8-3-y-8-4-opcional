name: Aplicar revisión (temporal)

on:
  push:
    branches: [ main ]
    paths: [ '.setup/**' ]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar paquete de cambios
        run: |
          base64 -di .setup/cambios.b64 > /tmp/cambios.tar.gz
          tar -xzf /tmp/cambios.tar.gz -C .
          git rm -r -q .setup
          git config user.name "christianhm97"
          git config user.email "christianhm97@users.noreply.github.com"
          git add -A
          git commit -m "Revisión del curso: tests más tolerantes, enunciados corregidos y formato del código"
          git push
